databases:
  - name: edumanage-db
    databaseName: edumanage
    user: edumanage
    plan: free

services:
  - type: web
    name: edumanage-school-erp
    env: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "python manage.py migrate --no-input && python seed_demo_data.py && gunicorn school_erp.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: edumanage-db
          property: connectionString
