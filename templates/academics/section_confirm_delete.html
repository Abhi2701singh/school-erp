{% extends 'base.html' %}

{% block title %}Delete Section - EduManage ERP{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card card-custom p-4 border-danger">
            <div class="text-center mb-4">
                <div class="rounded-circle bg-danger bg-opacity-10 text-danger d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                    <i class="fa-solid fa-trash-can display-6"></i>
                </div>
                <h4 class="fw-bold text-danger">Delete Section</h4>
                <p class="text-muted">Are you sure you want to delete <strong>{{ section.class_level.name }} - Section {{ section.name }}</strong>?</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex flex-column-reverse flex-sm-row justify-content-center gap-2">
                    <a href="{% url 'section_list' %}" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 fw-bold">
                        <i class="fa-solid fa-trash-can me-2"></i> Yes, Delete Section
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
