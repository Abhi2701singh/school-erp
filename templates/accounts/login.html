<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduManage Multi-School ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            padding: 2rem 1.5rem 1.5rem;
            color: white;
            text-align: center;
        }
        .brand-logo-icon {
            width: 54px;
            height: 54px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin-bottom: 0.75rem;
        }
        .login-body {
            padding: 1.5rem;
        }
        @media (min-width: 576px) {
            .login-header {
                padding: 2.5rem 2rem 2rem;
            }
            .brand-logo-icon {
                width: 60px;
                height: 60px;
                font-size: 2rem;
                margin-bottom: 1rem;
            }
            .login-body {
                padding: 2rem;
            }
        }
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            padding: 0.75rem;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #4338ca, #6b21a8);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="brand-logo-icon">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h4 class="fw-bold mb-1">EduManage ERP</h4>
        <p class="mb-0 text-white-50 fs-7">Multi-School Management System</p>
    </div>

    <div class="login-body">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show border-0 fs-7" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Username or Email</label>
                {{ form.username }}
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary">Password</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3 fs-6">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Log In to Portal
            </button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">Supports Nursery to Class 12 Schools</small>
        </div>
    </div>
</div>

</body>
</html>
