{% extends 'base.html' %}

{% block title %}My Profile - EduManage ERP{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-xl-8">
        <div class="card card-custom p-3 p-sm-4">
            <h4 class="fw-bold mb-4"><i class="fa-solid fa-user-gear text-primary me-2"></i> Profile Settings</h4>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-semibold">First Name</label>
                        {{ form.first_name }}
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-semibold">Last Name</label>
                        {{ form.last_name }}
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-semibold">Email Address</label>
                        {{ form.email }}
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label fw-semibold">Phone Number</label>
                        {{ form.phone }}
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Profile Photo</label>
                        {{ form.profile_photo }}
                    </div>
                </div>
                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-primary w-100 w-sm-auto px-4 fw-bold">
                        <i class="fa-solid fa-floppy-disk me-2"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
