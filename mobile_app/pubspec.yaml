name: edumanage_school_erp
description: "EduManage ERP - Multi-Tenant School Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Networking & HTTP
  http: ^1.2.0
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage & Sessions
  shared_preferences: ^2.2.2
  
  # UI, Icons & Styling
  google_fonts: ^6.1.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  
  # File & Image Picker for Fee Proof Uploads
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  
  # Visual Charts for Attendance & Marks
  fl_chart: ^0.66.2
  
  # URL & PDF Launcher
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
