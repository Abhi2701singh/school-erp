name = "edumanage-school-erp"
main = "worker.py"
compatibility_date = "2024-09-01"
compatibility_flags = ["python_workers"]

# Cloudflare Static Assets Configuration (Edge CDN)
[assets]
directory = "./staticfiles"
binding = "ASSETS"

# Environment Variables
[vars]
DJANGO_DEBUG = "False"
ALLOWED_HOSTS = "*"
TIME_ZONE = "Asia/Kolkata"
